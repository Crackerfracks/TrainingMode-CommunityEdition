# ---------------------------------------------------------------------------
# Steering for pointer menus: stick offset = gain * distance, clamped to
# max_push; inside dead_zone of the target centre the stick is released.
[steer]
gain      = 0.04
min_push  = 0.12
max_push  = 0.5
dead_zone = 1.2
# seconds a step may take before nav gives up and reports it
step_limit = 20
